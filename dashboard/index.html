<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Эмийн үнийн мониторинг</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        /* ===== TOP CONTROLS ===== */
        .top-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            max-width: 1000px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        select, input, button {
            padding: 6px;
            font-size: 14px;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            cursor: pointer;
            background: #1976d2;
            color: white;
            border: none;
        }

        button:hover {
            background: #135ba1;
        }

        h2 {
            margin-bottom: 10px;
        }

        h3 {
            margin-top: 15px;
            margin-bottom: 6px;
        }

        /* ===== PHARMACY LIST GRID ===== */
        #list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .card {
            background: white;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            transition: 0.2s;
        }

        .card:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }

        .price {
            color: #1a9b3b;
            font-weight: bold;
            margin: 5px 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            #list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .top-controls {
                grid-template-columns: 1fr;
            }

            #list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h2>💊 Эмийн үнийн мониторинг</h2>

<!-- ===== TOP CONTROLS ===== -->
<div class="top-controls">
    <div>
        <label>Эм сонгох</label>
        <select id="productSelect"></select>
    </div>

    <div>
        <label>Эмийн сан хайх</label>
        <input id="search" placeholder="Эмийн сангийн нэр">
    </div>
</div>

<h3>📥 Excel татах (огноогоор)</h3>
<div class="top-controls">
    <input type="date" id="startDate">
    <input type="date" id="endDate">
</div>
<button onclick="downloadExcel()" style="max-width:200px;margin-top:6px;">
    Excel татах
</button>

<h3>↕️ Эрэмбэлэх</h3>
<select id="sortSelect" style="max-width:250px;">
    <option value="asc">Үнэ: Бага → Их</option>
    <option value="desc">Үнэ: Их → Бага</option>
</select>

<h3>🏪 Эмийн сангийн жагсаалт</h3>
<div id="list"></div>

<pre id="debug" style="color:red"></pre>

<script>
const API = "http://103.50.205.83:8000";
let pharmacies = [];

/* =====================
   LOAD PRODUCTS
===================== */
async function loadProducts() {
    try {
        const res = await fetch(API + "/products");
        const data = await res.json();

        const select = document.getElementById("productSelect");
        select.innerHTML = "";

        data.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.product_url;
            opt.textContent = p.product_name;
            select.appendChild(opt);
        });

        if (data.length > 0) {
            select.value = data[0].product_url;
            loadPharmacies(data[0].product_url);
        }

    } catch (e) {
        document.getElementById("debug").textContent =
            "Products API алдаа: " + e.message;
    }
}

/* =====================
   LOAD PHARMACIES
===================== */
async function loadPharmacies(productUrl) {
    try {
        const res = await fetch(
            API + "/pharmacies?product_url=" + encodeURIComponent(productUrl)
        );

        if (!res.ok) {
            throw new Error(await res.text());
        }

        pharmacies = await res.json();
        pharmacies.sort((a, b) => a.price - b.price);
        renderList(pharmacies);

    } catch (e) {
        document.getElementById("debug").textContent =
            "Pharmacies API алдаа: " + e.message;
    }
}

/* =====================
   RENDER LIST
===================== */
function renderList(data) {
    const list = document.getElementById("list");
    list.innerHTML = "";

    if (data.length === 0) {
        list.innerHTML = "<i>Мэдээлэл олдсонгүй</i>";
        return;
    }

    data.forEach(p => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
            <div><b>${p.pharmacy}</b></div>
            <div class="price">${p.price.toLocaleString()} ₮</div>
            <div>${p.address || ""}</div>
            <div>${p.phone || ""}</div>
        `;
        list.appendChild(div);
    });
}

/* =====================
   SEARCH
===================== */
document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    renderList(
        pharmacies.filter(p =>
            p.pharmacy.toLowerCase().includes(q)
        )
    );
});

/* =====================
   SORT
===================== */
document.getElementById("sortSelect").addEventListener("change", e => {
    const order = e.target.value;

    const sorted = [...pharmacies].sort((a, b) =>
        order === "asc" ? a.price - b.price : b.price - a.price
    );

    renderList(sorted);
});

/* =====================
   PRODUCT CHANGE
===================== */
document.getElementById("productSelect").addEventListener("change", e => {
    loadPharmacies(e.target.value);
});

/* =====================
   EXCEL DOWNLOAD
===================== */
function downloadExcel() {
    const productUrl = document.getElementById("productSelect").value;
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;

    if (!productUrl || !startDate || !endDate) {
        alert("Эм болон огноо сонгоно уу");
        return;
    }

    const url =
        API +
        "/export/excel" +
        "?product_url=" + encodeURIComponent(productUrl) +
        "&start_date=" + startDate +
        "&end_date=" + endDate;

    window.location.href = url;
}

/* INIT */
loadProducts();
</script>

</body>
</html>
