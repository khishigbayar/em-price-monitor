<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Эмийн үнийн мониторинг</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }
        select, input, button {
            padding: 8px;
            font-size: 16px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 10px;
        }
        button {
            cursor: pointer;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        h2, h3 {
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="top-controls">
    <div>
        <label>💊 Эм сонгох</label>
        <select id="productSelect"></select>
    </div>

    <div>
        <label>🔍 Эмийн сан хайх</label>
        <input id="search" placeholder="Эмийн сангийн нэр">
    </div>
</div>

<h3>📥 Excel татах (огноогоор)</h3>
<input type="date" id="startDate">
<input type="date" id="endDate">
<button onclick="downloadExcel()">Excel татах</button>

<h3>↕️ Эрэмбэлэх</h3>
<select id="sortSelect">
    <option value="asc">Үнэ: Бага → Их</option>
    <option value="desc">Үнэ: Их → Бага</option>
</select>

<h3>🏪 Эмийн сангийн жагсаалт</h3>
<div id="list"></div>

<pre id="debug" style="color:red"></pre>

<script>
const API = "http://103.50.205.83:8000";
let pharmacies = [];

// =====================
// LOAD PRODUCTS
// =====================
async function loadProducts() {
    try {
        const res = await fetch(API + "/products");
        const data = await res.json();

        const select = document.getElementById("productSelect");
        select.innerHTML = "";

        data.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.product_url;        // backend-д дамжина
            opt.textContent = p.product_name; // хэрэглэгчид харагдана
            select.appendChild(opt);
        });

        if (data.length > 0) {
            select.value = data[0].product_url;
            loadPharmacies(data[0].product_url);
        }

    } catch (e) {
        document.getElementById("debug").textContent =
            "Products API алдаа: " + e.message;
    }
}

// =====================
// LOAD PHARMACIES
// =====================
async function loadPharmacies(productUrl) {
    try {
        const res = await fetch(
            API + "/pharmacies?product_url=" + encodeURIComponent(productUrl)
        );

        if (!res.ok) {
            const text = await res.text();
            throw new Error(text);
        }

        pharmacies = await res.json();

        // default: бага → их
        pharmacies.sort((a, b) => a.price - b.price);
        renderList(pharmacies);

    } catch (e) {
        document.getElementById("debug").textContent =
            "Pharmacies API алдаа: " + e.message;
    }
}

// =====================
// RENDER LIST
// =====================
function renderList(data) {
    const list = document.getElementById("list");
    list.innerHTML = "";

    if (data.length === 0) {
        list.innerHTML = "<i>Мэдээлэл олдсонгүй</i>";
        return;
    }

    data.forEach(p => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
            <div><b>${p.pharmacy}</b></div>
            <div class="price">${p.price.toLocaleString()} ₮</div>
            <div>${p.address || ""}</div>
            <div>${p.phone || ""}</div>
        `;
        list.appendChild(div);
    });
}

// =====================
// SEARCH
// =====================
document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    renderList(
        pharmacies.filter(p =>
            p.pharmacy.toLowerCase().includes(q)
        )
    );
});

// =====================
// SORT
// =====================
document.getElementById("sortSelect").addEventListener("change", e => {
    const order = e.target.value;

    const sorted = [...pharmacies].sort((a, b) => {
        if (order === "asc") return a.price - b.price;
        return b.price - a.price;
    });

    renderList(sorted);
});

// =====================
// PRODUCT CHANGE
// =====================
document.getElementById("productSelect").addEventListener("change", e => {
    loadPharmacies(e.target.value);
});

// =====================
// EXCEL DOWNLOAD
// =====================
function downloadExcel() {
    const productUrl = document.getElementById("productSelect").value;
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;

    if (!productUrl || !startDate || !endDate) {
        alert("Эм болон огноо сонгоно уу");
        return;
    }

    const url =
        API +
        "/export/excel" +
        "?product_url=" + encodeURIComponent(productUrl) +
        "&start_date=" + startDate +
        "&end_date=" + endDate;

    window.location.href = url;
}

// INIT
loadProducts();
</script>

</body>
</html>
